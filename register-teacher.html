<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Create Account | QNHS Portal</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <img class="logo" src="Quezon_National_High_School_Seal.png" alt="QNHS school logo">
    <p class="eyebrow">QNHS Portal</p><h2>Create Teacher Account</h2>
    <p class="muted">Complete the form to create an account.</p>
    <form action="login-teacher.html" method="get">
      <label for="fullname">Full name</label>
      <input id="fullname" name="fullname" type="text" autocomplete="name" placeholder="Enter full name" required>
      <label for="email">School email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter school email" required>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" placeholder="Choose a username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
      <button class="btn primary" type="submit">Create Account</button>
    </form>
    <p class="notice">Already registered? <a href="login-teacher.html">Sign in</a></p>
    <a class="back" href="index.html">← Back to portal home</a>
  </main>
</body>
</html>
