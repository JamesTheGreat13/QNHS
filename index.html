<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QNHS Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <!-- Replace with your direct transparent PNG logo URL -->
    <img class="logo" src="Quezon_National_High_School_Seal.png" alt="QNHS school logo">
    <p class="eyebrow">Welcome to</p>
    <h1>QNHS Portal</h1>
    <p>Select your account type to continue.</p>
    <nav class="roles" aria-label="Choose account type">
      <a class="role" href="login-admin.html"><span class="symbol">⚙</span><span>ADMIN</span></a>
      <a class="role" href="login-student.html"><span class="symbol">🎓</span><span>Student</span></a>
      <a class="role" href="login-teacher.html"><span class="symbol">▣</span><span>Teacher</span></a>
    </nav>
    <div class="divider"><span>or</span></div>
    <div class="actions">
      <a class="btn primary" href="register-student.html">＋ Create Account</a>
      <a class="btn secondary" href="login-student.html">⇥ Sign In</a>
    </div>
    <p class="muted">Quezon National High School · Knowledge Is Power</p>
  </main>
</body>
</html>
